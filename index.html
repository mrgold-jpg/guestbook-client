<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guestbook</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    form {
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }

    button {
      padding: 10px;
      width: 100%;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

    .entry {
      background: white;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Hello World!</h1>
  <h1>Guestbook</h1>

  <form id="guestForm">
    <input type="text" id="name" placeholder="Your name" required>
    <textarea id="message" placeholder="Your message" required></textarea>
    <button type="submit">Sign Guestbook</button>
  </form>

  <div id="entries"></div>

  <footer>
    © 2026 Dylan Throckmorton
  </footer>

  <script>
    const form = document.getElementById("guestForm");
    const entriesDiv = document.getElementById("entries");

    // Load saved entries
    let entries = JSON.parse(localStorage.getItem("guestbookEntries")) || [];

    function displayEntries() {
      entriesDiv.innerHTML = "";
      entries.forEach(entry => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `<strong>${entry.name}</strong><br>${entry.message}`;
        entriesDiv.appendChild(div);
      });
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const message = document.getElementById("message").value;

      const newEntry = { name, message };
      entries.push(newEntry);

      localStorage.setItem("guestbookEntries", JSON.stringify(entries));

      form.reset();
      displayEntries();
    });

    displayEntries();
  </script>

</body>
</html>
